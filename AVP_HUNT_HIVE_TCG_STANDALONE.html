</script><script>(function () {
  'use strict';
  const D = window.AVP_DATA;
  const CARD = new Map(D.cards.map(c => [c.id, c]));
  const RANK = Object.fromEntries(Object.entries(D.rarities).map(([k,v]) => [k,v.rank]));

  const U = {
    clamp: (v,a,b) => Math.max(a,Math.min(b,v)),
    clone: v => JSON.parse(JSON.stringify(v)),
    uid: (p='id') => `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,
    hash(str) { let h=2166136261>>>0; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; },
    rng(seed) { let a=(seed>>>0)||1; return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; },
    shuffle(arr,rng=Math.random) { const out=arr.slice(); for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];} return out; },
    choice(arr,rng=Math.random){return arr[Math.floor(rng()*arr.length)] || arr[0];},
    weighted(items,rng=Math.random){const total=items.reduce((s,x)=>s+x.weight,0);let n=rng()*total;for(const x of items){n-=x.weight;if(n<=0)return x.value;}return items[items.length-1]?.value;},
    format: n => new Intl.NumberFormat('fr-FR').format(Math.max(0,Math.round(n||0))),
  };

  function expandDeck(deckMap){
    const out=[];
    for(const [id,count] of Object.entries(deckMap||{})) for(let i=0;i<count;i++) if(CARD.has(id)) out.push(id);
    return out;
  }

  function validateDeck(deckMap, collection=null){
    const errors=[]; const entries=Object.entries(deckMap||{}).filter(([,n])=>n>0);
    const total=entries.reduce((s,[,n])=>s+n,0);
    if(total!==D.rules.deckSize) errors.push(`Le deck doit contenir exactement ${D.rules.deckSize} cartes (${total} actuellement).`);
    for(const [id,n] of entries){
      if(!CARD.has(id)){errors.push(`Carte inconnue : ${id}`);continue;}
      if(n>D.rules.maxCopies) errors.push(`${CARD.get(id).name} dépasse ${D.rules.maxCopies} exemplaires.`);
      if(collection && (collection[id]||0)<n) errors.push(`Collection insuffisante : ${CARD.get(id).name} (${collection[id]||0}/${n}).`);
    }
    return {valid:errors.length===0,errors,total};
  }

  function rarityRoll(minRank, rng, pity=0){
    let weights;
    if(minRank<=1) weights=[['C',67],['R',26],['SR',5.4],['UR',1.3],['SCR',.25],['PR',.045],['GR',.005]];
    else weights=[['R',61],['SR',27],['UR',9],['SCR',2.5],['PR',.45],['GR',.05]];
    if(pity>=89) return 'PR';
    if(pity>=29) return 'SCR';
    if(pity>=9) return 'UR';
    return U.weighted(weights.filter(([r])=>RANK[r]>=minRank).map(([value,weight])=>({value,weight})),rng);
  }

  function pickCardFromSet(setId, rarity, rng, used){
    let pool=D.cards.filter(c=>c.set===setId && c.rarity===rarity);
    if(!pool.length){
      const wanted=RANK[rarity];
      pool=D.cards.filter(c=>c.set===setId).sort((a,b)=>Math.abs(RANK[a.rarity]-wanted)-Math.abs(RANK[b.rarity]-wanted));
      if(pool.length){const delta=Math.abs(RANK[pool[0].rarity]-wanted);pool=pool.filter(c=>Math.abs(RANK[c.rarity]-wanted)===delta);}
    }
    if(!pool.length) pool=D.cards;
    const fresh=pool.filter(c=>!used.has(c.id));
    return U.choice(fresh.length?fresh:pool,rng);
  }

  function openBooster(packId, opts={}){
    const pack=D.boosters.find(p=>p.id===packId); if(!pack) throw new Error('Booster inconnu');
    const seed=opts.seed ?? (Date.now()^U.hash(packId)); const rng=U.rng(seed);
    const pity=opts.pity||0; const used=new Set(); const pulls=[];
    for(let i=0;i<9;i++){
      const minRank=i<6?1:2;
      let rarity=rarityRoll(minRank,rng,i===8?pity:0);
      if(i===8 && pity>=9 && RANK[rarity]<4) rarity='UR';
      const card=pickCardFromSet(pack.set,rarity,rng,used); used.add(card.id);
      pulls.push({cardId:card.id,foil:i===8 || (i>5&&rng()<.22),slot:i,rolledRarity:rarity});
    }
    pulls.sort((a,b)=>RANK[CARD.get(a.cardId).rarity]-RANK[CARD.get(b.cardId).rarity]);
    return {pack,seed,pulls,bestRank:Math.max(...pulls.map(p=>RANK[CARD.get(p.cardId).rarity]))};
  }

  function buildAiDeck(factions=['XENO'], difficulty=1, seed=1){
    const rng=U.rng(seed); const allowed=new Set(factions); allowed.add('NEUTRAL');
    let pool=D.cards.filter(c=>allowed.has(c.faction) && (c.set!=='PX00'||difficulty>=2.1));
    if(!pool.length) pool=D.cards.filter(c=>c.faction==='XENO');
    const targets={UNIT:19,TACTIC:6,EQUIPMENT:3,LOCATION:2};
    const deck={};
    const score=c=>{
      let s=1;
      if(c.type==='UNIT') s+=(c.attack+c.health)/1000-Math.abs(c.cost-3.5)*.15;
      if(c.rarity==='UR'||c.rarity==='SCR')s+=difficulty*.35;
      if(c.rarity==='PR'||c.rarity==='GR')s+=difficulty>.95?1:-1;
      return Math.max(.1,s);
    };
    for(const [type,count] of Object.entries(targets)){
      const typed=pool.filter(c=>c.type===type);
      for(let i=0;i<count;i++){
        const candidates=typed.filter(c=>(deck[c.id]||0)<3);
        if(!candidates.length)break;
        const id=U.weighted(candidates.map(c=>({value:c.id,weight:score(c)})),rng);
        deck[id]=(deck[id]||0)+1;
      }
    }
    while(Object.values(deck).reduce((a,b)=>a+b,0)<30){
      const candidates=pool.filter(c=>(deck[c.id]||0)<3 && c.type!=='LOCATION');
      const id=U.choice(candidates,rng)?.id; if(!id)break; deck[id]=(deck[id]||0)+1;
    }
    return deck;
  }

  class Battle {
    constructor(options={}){
      this.id=U.uid('battle'); this.onChange=options.onChange||(()=>{}); this.onLog=options.onLog||(()=>{}); this.onGameOver=options.onGameOver||(()=>{});
      this.rng=U.rng(options.seed ?? Date.now()); this.difficulty=options.difficulty||1; this.modifiers=options.modifiers||[];

    else if(card.faction==='ENGINEER')subject=`<ellipse cx="120" cy="70" rx="42" ry="53" fill="url(#${gid})"/><path d="M70 230 Q78 120 120 118 Q162 120 170 230Z" fill="url(#${gid})"/><g fill="none" stroke="${f.accent}" opacity=".45">${[38,55,72].map(r=>`<ellipse cx="120" cy="142" rx="${r}" ry="${r/2}"/>`).join('')}</g><circle cx="105" cy="67" r="5" fill="#050908"/><circle cx="136" cy="67" r="5" fill="#050908"/>`;
    else subject=`<path d="M120 25 L168 78 L151 140 L193 210 L120 181 L47 210 L89 140 L72 78Z" fill="url(#${gid})"/><circle cx="120" cy="110" r="38" fill="#07100e" opacity=".6"/><path d="M83 108 Q120 76 158 108 Q120 151 83 108Z" fill="${f.accent}" opacity=".72"/>`;
    const rings=Array.from({length:6},(_,i)=>`<circle cx="${(seed*(i+3))%230}" cy="${(seed*(i+7))%260}" r="${6+((seed>>>i)%22)}" fill="none" stroke="${f.accent}" opacity="${.04+i*.018}"/>`).join('');
    return `<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration abstraite ${esc(card.name)}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${f.accent}"/><stop offset=".48" stop-color="${f.dark}"/><stop offset="1" stop-color="#050908"/></linearGradient><filter id="glow${gid}"><feGaussianBlur stdDeviation="${2+(a%4)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="240" height="260" fill="#050908"/><path d="M0 ${40+a} Q${90+b} ${10+c} 240 ${72+a} V260 H0Z" fill="${f.dark}" opacity=".65"/>${rings}<g filter="url(#glow${gid})" transform="translate(${(a%5)-2} ${(b%5)-2})">${subject}</g><path d="M0 230 L240 190 V260 H0Z" fill="#030504" opacity=".75"/><text x="12" y="247" fill="${f.accent}" opacity=".65" font-size="9" font-family="monospace">${esc(card.collectorNo)} // ${TYPE_ICONS[card.type]}</text></svg>`;
  }

  function cardHTML(card,opts={}){
    if(opts.back)return `<div class="tcg-card back ${opts.mini?'mini':''}"><div class="card-inner"><div class="back-mark">⌁</div></div></div>`;
    const f=faction(card.faction),r=rarity(card.rarity),kws=(card.keywords||[]).slice(0,opts.mini?2:4);
    const stats=card.type==='UNIT'?`<div class="stat atk">⚔ ${U.format(card.attack)}</div><div class="stat hp">♥ ${U.format(card.health)}</div>`:
      card.type==='EQUIPMENT'?`<div class="stat atk">+${U.format(card.attack)} ATK</div><div class="stat hp">+${U.format(card.health)} PV</div>`:
      `<div class="stat">${TYPE_ICONS[card.type]} ${TYPE_NAMES[card.type]}</div>`;
    return `<div class="tcg-card r-${card.rarity} ${opts.foil?'foil':''} ${opts.mini?'mini':''}" style="--fa:${f.accent};--fd:${f.dark}"><div class="card-inner"><div class="card-top"><div class="card-cost">${card.cost}</div><div class="card-name">${esc(card.name)}</div><div class="card-set">${card.set}</div></div><div class="card-art">${artSvg(card)}</div><div class="card-typebar"><span>${f.symbol} ${TYPE_NAMES[card.type]}</span><span class="card-rarity">${r.short}</span></div><div class="card-text">${kws.length?`<div class="card-keywords">${kws.map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>`:''}${esc(card.text)}</div><div class="card-stats">${stats}<span class="collector">${card.collectorNo}</span></div></div></div>`;
  }
  function cardWrap(card,opts={}){const owned=Store.owned(card.id);return `<div class="card-wrap ${opts.clickable!==false?'clickable':''}" ${opts.action?`data-action="${opts.action}"`:''} data-card-id="${card.id}">${opts.showOwned!==false?`<span class="owned-badge ${owned?'':'zero'}">${owned}</span>`:''}${cardHTML(card,opts)}</div>`;}

  function navHTML(mobile=false){const items=mobile?NAV.filter(x=>['home','play','collection','boosters','decks'].includes(x[0])):NAV;return items.map(([id,icon,label])=>`<button class="${mobile?'':'nav-btn'} ${state.screen===id?'active':''}" data-action="nav" data-screen="${id}">${mobile?`<i>${icon}</i>`:''}${label}</button>`).join('');}
  function shell(content,wide=false){
    const p=Store.data.profile;return `<div class="shell ${Store.data.settings.motion?'':'no-motion'}"><header class="topbar"><div class="brand" data-action="nav" data-screen="home"><div class="brand-mark">⌁</div><div class="brand-copy"><b>AVP: HUNT // HIVE</b><span>TACTICAL CARD GAME</span></div></div><nav class="main-nav">${navHTML()}</nav><div class="profile-strip"><div class="currency" title="Crédits"><i>◈</i><span>${U.format(p.credits)}</span></div><div class="currency" title="Poussière de synthèse"><i>✧</i><span>${U.format(p.dust)}</span></div><button class="icon-btn" data-action="settings" aria-label="Paramètres">⚙</button></div></header><main class="screen ${wide?'wide':''}">${content}</main><nav class="mobile-nav">${navHTML(true)}</nav></div>`;
  }
  function screenHead(kicker,title,desc,actions=''){return `<div class="screen-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`;}

  function heroCards(){const ids=['X_BIG_CHAP','Y_JUNGLE_HUNTER','H_RIPLEY'];return ids.map((id,i)=>cardHTML(CARD.get(id),{mini:false,foil:i===2})).join('');}
  function renderHome(){
    const p=Store.data.profile,deck=Store.deck(),valid=deck?E.validateDeck(deck.cards,Store.data.collection):{valid:false,total:0};const discovered=ownedUnique();
    return shell(`<section class="hero"><div class="hero-copy"><div class="eyebrow">JEU COMPLET HORS LIGNE • VERSION ${D.version}</div><h1>HUNT.<br><span>HIVE.</span><br>SURVIVE.</h1><p class="tagline">Construisez un deck Alien, Predator, AVP, Humain ou Engineer. Ouvrez des boosters, collectionnez sept raretés et combattez sur trois voies tactiques.</p><div class="hero-actions"><button class="btn primary" data-action="quick-launch">⚔ Duel rapide</button><button class="btn secondary" data-action="nav" data-screen="boosters">◇ Ouvrir un booster</button><button class="btn ghost" data-action="nav" data-screen="campaign">⬡ Campagne</button></div><div class="hero-meta"><div class="hero-stat"><b>${D.cards.length}</b><span>cartes jouables</span></div><div class="hero-stat"><b>${discovered}/${D.cards.length}</b><span>découvertes</span></div><div class="hero-stat"><b>${p.completedMissions}/8</b><span>missions</span></div><div class="hero-stat"><b>${p.wins}</b><span>victoires</span></div></div></div><div class="hero-stage"><div class="hero-orbit"></div><div class="hero-card-stack">${heroCards()}</div><div class="floating-chip a">7 niveaux de rareté</div><div class="floating-chip b">IA tactique</div><div class="floating-chip c">Sauvegarde locale</div></div></section>
    <section class="dashboard-grid"><article class="panel dash-card span-4"><div class="eyebrow">DECK ACTIF</div><h3>${deck?esc(deck.name):'Aucun deck'}</h3><p>${deck?`${valid.total}/30 cartes • ${valid.valid?'Prêt au combat':'À corriger'}`:'Choisissez un deck de départ.'}</p><div class="progress" style="margin-top:16px"><i style="width:${Math.min(100,(valid.total||0)/30*100)}%"></i></div><div style="margin-top:14px"><button class="btn small" data-action="nav" data-screen="decks">Gérer le deck</button></div><span class="watermark">▤</span></article>
    <article class="panel dash-card span-4"><div class="eyebrow">PROGRESSION</div><div class="big">Niv. ${p.level}</div><p>${U.format(p.xp)} / ${U.format(xpNeeded(p.level))} XP</p><div class="progress" style="margin-top:16px"><i style="width:${p.xp/xpNeeded(p.level)*100}%"></i></div><span class="watermark">✦</span></article>
    <article class="panel dash-card span-4"><div class="eyebrow">COLLECTION</div><div class="big">${Math.round(discovered/D.cards.length*100)}%</div><p>${collectionTotal()} cartes possédées • ${U.format(p.dust)} poussières</p><div class="progress" style="margin-top:16px"><i style="width:${discovered/D.cards.length*100}%"></i></div><span class="watermark">▦</span></article>
    <article class="panel dash-card span-7"><div class="eyebrow">ACCÈS RAPIDE</div><div class="quick-list"><div class="quick-row" data-action="nav" data-screen="play"><div class="quick-icon">⚔</div><div><b>Exhibition contre l’IA</b><span>Choisir faction et difficulté</span></div><em>›</em></div><div class="quick-row" data-action="nav" data-screen="campaign"><div class="quick-icon">⬡</div><div><b>Campagne narrative</b><span>${p.completedMissions===8?'Toutes les missions terminées':`Prochaine mission : ${Math.min(8,p.completedMissions+1)}/8`}</span></div><em>›</em></div><div class="quick-row" data-action="nav" data-screen="boosters"><div class="quick-icon">◇</div><div><b>Boutique de boosters</b><span>Garantie Rare, protection de malchance</span></div><em>›</em></div></div></article>
    <article class="panel dash-card span-5"><div class="eyebrow">DOSSIER SOURCE</div><h3>Encyclopédies Alien & Predator</h3><p>Le pool de lancement transforme les catégories des classeurs — castes, humains, armes, équipements, lieux, rituels et prototypes — en cartes équilibrées et traçables.</p><div style="margin-top:15px"><button class="btn small" data-action="nav" data-screen="archive">Consulter l’archive</button></div><span class="watermark">◎</span></article></section>`);
  }

  function renderPlay(){
    const deck=Store.deck(),check=deck?E.validateDeck(deck.cards,Store.data.collection):{valid:false,errors:['Aucun deck actif.']};
    return shell(`${screenHead('MODE EXHIBITION','Choisissez votre chasse','Affrontez une IA générée depuis les factions du catalogue. La campagne applique des modificateurs supplémentaires.',`<button class="btn ghost" data-action="nav" data-screen="decks">▤ Deck actif</button>`)}<div class="play-grid"><section class="panel mode-card"><div class="eyebrow">DUEL RAPIDE</div><h2>${deck?esc(deck.name):'Aucun deck actif'}</h2><p>${check.valid?'Votre deck respecte les 30 cartes et peut entrer en duel.':esc(check.errors.join(' '))}</p><h3 style="font-size:12px;margin:16px 0 3px">Difficulté</h3><div class="difficulty">${DIFFICULTIES.map(d=>`<button class="diff-btn ${state.ui.difficulty===d.id?'active':''}" data-action="difficulty" data-id="${d.id}">${d.name}</button>`).join('')}</div><h3 style="font-size:12px;margin:5px 0 9px">Faction adverse</h3><div class="enemy-select">${['XENO','YAUTJA','HUMAN','ENGINEER','HYBRID'].map(id=>{const f=faction(id);return `<button class="enemy-btn ${state.ui.enemyFaction===id?'active':''}" style="--ep:${f.accent}" data-action="enemy-faction" data-id="${id}">${f.symbol} ${f.short}</button>`}).join('')}</div><button class="btn primary block" data-action="start-quick" ${check.valid?'':'disabled'}>Lancer le duel</button></section><aside class="panel pad"><div class="eyebrow">RÈGLES DU DUEL</div><h2 style="margin:10px 0">Trois voies. 8 000 PV.</h2><div class="quick-list"><div class="quick-row"><div class="quick-icon">1</div><div><b>Énergie croissante</b><span>1 à 10 points au fil des tours</span></div></div><div class="quick-row"><div class="quick-icon">2</div><div><b>Déploiement par voie</b><span>Une unité de chaque camp par voie</span></div></div><div class="quick-row"><div class="quick-icon">3</div><div><b>Effets de faction</b><span>Ruche, Trophée, Escouade, Pathogène</span></div></div><div class="quick-row"><div class="quick-icon">4</div><div><b>Victoire</b><span>Réduire le commandant adverse à 0 PV</span></div></div></div><button class="btn secondary block" style="margin-top:16px" data-action="nav" data-screen="campaign">Voir la campagne</button></aside></div>`,false);
  }

  function filteredCards(filters=state.filters,ownedOnly=false){
    const q=(filters.query||'').trim().toLowerCase();return D.cards.filter(c=>{
      if(q&&!c.searchText.includes(q))return false;if(filters.faction&&filters.faction!=='ALL'&&c.faction!==filters.faction)return false;if(filters.type&&filters.type!=='ALL'&&c.type!==filters.type)return false;if(filters.rarity&&filters.rarity!=='ALL'&&c.rarity!==filters.rarity)return false;if(filters.set&&filters.set!=='ALL'&&c.set!==filters.set)return false;if((ownedOnly||filters.owned==='OWNED')&&!Store.owned(c.id))return false;if(filters.owned==='MISSING'&&Store.owned(c.id))return false;return true;
    }).sort((a,b)=>RANK[b.rarity]-RANK[a.rarity]||a.name.localeCompare(b.name,'fr'));
  }
  function filtersHTML(filters,prefix='collection',full=true){return `<div class="panel filters"><label class="field">⌕ <input data-filter-prefix="${prefix}" data-filter="query" value="${esc(filters.query||'')}" placeholder="Rechercher une carte…"></label><label class="field"><select data-filter-prefix="${prefix}" data-filter="faction"><option value="ALL">Toutes factions</option>${Object.entries(D.factions).map(([id,f])=>`<option value="${id}" ${filters.faction===id?'selected':''}>${f.name}</option>`).join('')}</select></label><label class="field"><select data-filter-prefix="${prefix}" data-filter="type"><option value="ALL">Tous types</option>${Object.entries(TYPE_NAMES).map(([id,n])=>`<option value="${id}" ${filters.type===id?'selected':''}>${n}</option>`).join('')}</select></label>${full?`<label class="field"><select data-filter-prefix="${prefix}" data-filter="rarity"><option value="ALL">Toutes raretés</option>${Object.entries(D.rarities).map(([id,r])=>`<option value="${id}" ${filters.rarity===id?'selected':''}>${r.name}</option>`).join('')}</select></label><label class="field"><select data-filter-prefix="${prefix}" data-filter="set"><option value="ALL">Toutes extensions</option>${Object.entries(D.sets).map(([id,s])=>`<option value="${id}" ${filters.set===id?'selected':''}>${id} — ${s.name}</option>`).join('')}</select></label><label class="field"><select data-filter-prefix="${prefix}" data-filter="owned"><option value="ALL" ${filters.owned==='ALL'?'selected':''}>Tout le catalogue</option><option value="OWNED" ${filters.owned==='OWNED'?'selected':''}>Possédées</option><option value="MISSING" ${filters.owned==='MISSING'?'selected':''}>Manquantes</option></select></label>`:''}<span class="filter-count" data-filter-count></span></div>`;}
  function renderCollection(){const list=filteredCards();return shell(`${screenHead('CATALOGUE MAÎTRE','Collection','Filtrez les 158 cartes, consultez leur origine et fabriquez les exemplaires manquants avec la poussière de synthèse.',`<button class="btn secondary" data-action="nav" data-screen="boosters">◇ Boosters</button>`)}${filtersHTML(state.filters)}<div class="card-grid">${list.map(c=>cardWrap(c,{action:'view-card'})).join('')||'<div class="panel pad subtle">Aucune carte ne correspond aux filtres.</div>'}</div>`,true);}

  function renderBoosters(){const p=Store.data.profile;return shell(`${screenHead('BOUTIQUE DE LA COMPAGNIE','Boosters','Chaque paquet contient 9 cartes, au moins une Rare et une carte brillante. Les séries se débloquent avec la campagne.',`<button class="btn ghost" data-action="nav" data-screen="collection">▦ Collection</button>`)}<div class="panel pity-box"><div><b>Protection de malchance</b><br><span>${p.pity} booster${p.pity>1?'s':''} sans Ultra Rare ou supérieure</span></div><div class="progress"><i style="width:${Math.min(100,p.pity/10*100)}%"></i></div><strong>${p.pity}/10</strong></div><div class="pack-grid">${D.boosters.map(pack=>{const set=D.sets[pack.set],locked=p.completedMissions<(pack.unlocksAt||0);const glyph={SIGNAL:'⌁',COLONY:'✦',HUNTER:'◈',RITUAL:'☣',EVOLUTION:'⬡',PROTOTYPE:'⟁'}[pack.art];return `<article class="panel pack ${locked?'locked':''}" style="--pc:${set.accent}"><div class="pack-art"><span class="pack-code">${pack.set} // 9 CARTES</span><span class="pack-glyph">${glyph}</span></div><span class="subtitle">${esc(pack.subtitle)}</span><h3>${esc(pack.name)}</h3><p>${esc(pack.description)}</p><div class="pack-footer"><span class="pack-price">◈ ${U.format(pack.price)}</span><button class="btn primary" data-action="buy-pack" data-id="${pack.id}" ${locked||p.credits<pack.price?'disabled':''}>${locked?`Mission ${pack.unlocksAt}`:'Ouvrir'}</button></div></article>`}).join('')}</div>`,true);}

  function renderDecks(){
    const deck=activeDeck();if(!state.selectedDeckId&&deck)state.selectedDeckId=deck.id;const check=deck?E.validateDeck(deck.cards,Store.data.collection):{valid:false,total:0,errors:['Aucun deck']};const list=filteredCards({...state.deckFilters,rarity:'ALL',set:'ALL',owned:'OWNED'},true).slice(0,100);
    const deckRows=deck?Object.entries(deck.cards).filter(([,n])=>n>0).sort((a,b)=>CARD.get(a[0]).cost-CARD.get(b[0]).cost||CARD.get(a[0]).name.localeCompare(CARD.get(b[0]).name)).map(([id,n])=>{const c=CARD.get(id);return `<div class="deck-row"><div><b>${esc(c.name)}</b><span>${c.cost} énergie • ${rarity(c.rarity).short} • possédé ${Store.owned(id)}</span></div><div class="count-controls"><button data-action="deck-remove" data-card-id="${id}">−</button><strong>${n}</strong><button data-action="deck-add" data-card-id="${id}">+</button></div></div>`}).join(''):'';
    return shell(`${screenHead('LABORATOIRE TACTIQUE','Constructeur de decks','Un deck contient exactement 30 cartes, avec trois exemplaires maximum de chaque carte possédée.',`<button class="btn" data-action="new-deck">＋ Nouveau deck</button><button class="btn secondary" data-action="set-active-deck" ${deck?'':'disabled'}>Activer</button>`)}<div class="deck-layout"><aside class="panel pad deck-sidebar"><div class="eyebrow">MES DECKS</div><div class="deck-tabs" style="margin-top:12px">${Store.data.decks.map(d=>`<button class="deck-tab ${d.id===deck?.id?'active':''}" data-action="select-deck" data-id="${d.id}"><b>${d.id===Store.data.activeDeckId?'● ':''}${esc(d.name)}</b><span>${deckTotal(d)}/30 cartes</span></button>`).join('')||'<p class="subtle">Aucun deck.</p>'}</div>${deck?`<button class="btn small block" style="margin-top:12px" data-action="rename-deck">Renommer</button><button class="btn small block" style="margin-top:7px" data-action="auto-fill-deck">Compléter automatiquement</button>`:''}</aside><section><div class="panel pad" style="margin-bottom:14px"><div class="deck-summary"><div><div class="eyebrow">${deck?esc(deck.name):'SÉLECTION'}</div><div class="deck-total ${check.valid?'':'invalid'}">${check.total||0}<small>/30</small></div></div><div style="text-align:right"><b style="color:${check.valid?'var(--good)':'var(--danger)'}">${check.valid?'Deck valide':'Deck incomplet'}</b><div class="subtle" style="font-size:10px;max-width:260px">${check.valid?'Prêt pour le duel.':esc(check.errors[0]||'Ajoutez des cartes.')}</div></div></div><div class="progress"><i style="width:${Math.min(100,(check.total||0)/30*100)}%"></i></div></div>${filtersHTML(state.deckFilters,'deck',false)}<div class="card-grid">${list.map(c=>`<div class="card-wrap">${cardHTML(c,{mini:false})}<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--muted)"><span>${Store.owned(c.id)} possédée(s) • ${deck?.cards?.[c.id]||0} dans le deck</span><button class="btn small" data-action="deck-add" data-card-id="${c.id}">＋</button></div></div>`).join('')}</div></section><aside class="panel pad deck-list-panel"><div class="eyebrow">LISTE DU DECK</div><div class="deck-list">${deckRows||'<p class="subtle">Ajoutez des cartes depuis le catalogue.</p>'}</div></aside></div>`,true);
  }

  function renderCampaign(){const p=Store.data.profile,deck=Store.deck(),valid=deck&&E.validateDeck(deck.cards,Store.data.collection).valid;return shell(`${screenHead('DOSSIER AVP','Campagne : Directive Chimère','Huit opérations parcourent Alien, Predator et AVP. Les victoires débloquent des boosters et la série de prototypes séparée du canon.',`<button class="btn ghost" data-action="nav" data-screen="archive">◎ Contexte des sources</button>`)}<div class="mission-grid">${D.campaign.map(m=>{const locked=m.id>p.completedMissions+1,done=m.id<=p.completedMissions;return `<article class="panel mission ${locked?'locked':''}"><span class="mission-num">0${m.id}</span><div class="sub">${esc(m.subtitle)}</div><h3>${esc(m.name)}</h3><div class="faction-pips">${m.factions.map(id=>{const f=faction(id);return `<span class="faction-pip" style="--pip:${f.accent}" title="${f.name}">${f.symbol}</span>`}).join('')}</div><p>${esc(m.description)}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span class="mission-reward">◈ ${U.format(m.reward)} • Booster ${D.boosters.find(b=>b.id===m.pack)?.set}</span><button class="btn ${done?'ghost':'primary'} small" data-action="start-mission" data-id="${m.id}" ${locked||!valid?'disabled':''}>${locked?'Verrouillée':done?'Rejouer':'Déployer'}</button></div>${done?'<span class="complete-stamp">OPÉRATION VALIDÉE</span>':''}</article>`}).join('')}</div>${!valid?'<div class="panel pad" style="margin-top:16px;border-color:rgba(255,101,125,.25)"><b style="color:var(--danger)">Deck actif invalide.</b> <span class="subtle">Corrigez-le dans le constructeur avant de lancer une mission.</span></div>':''}`,true);}

  function renderArchive(){const sm=D.sourceManifest,counts=sm.alien.notableCounts;return shell(`${screenHead('ENCYCLOPÉDIE JOUABLE','Archive & règles','Chaque carte conserve un lien de provenance interne vers le classeur et l’onglet ayant inspiré sa traduction de gameplay.',`<button class="btn secondary" data-action="export-catalog">⇩ Exporter le catalogue JSON</button>`)}<div class="archive-grid"><section class="panel source-card span-7"><div class="eyebrow">SOURCE ALIEN / AVP</div><h3>${esc(sm.alien.file)}</h3><p>${esc(sm.alien.role)}</p><div class="source-counts">${[['Véhicules',counts.vehicles],['Humains',counts.detailedHumans],['Lieux',counts.locations],['Rituels',counts.rituals],['Visions',counts.visions],['Faune',counts.fauna],['Flore',counts.flora],['Cartes du jeu',D.cards.length]].map(([n,v])=>`<div class="source-count"><b>${v}</b><span>${n}</span></div>`).join('')}</div></section><section class="panel source-card span-5"><div class="eyebrow">SOURCE PREDATOR</div><h3>${esc(sm.predator.file)}</h3><p>${esc(sm.predator.role)}</p><p class="source-note">Les cartes PX00 sont visuellement et mécaniquement séparées du pool principal afin de ne pas présenter un élément coupé ou annulé comme canon écran.</p></section>
    <section class="panel source-card span-6"><div class="eyebrow">RÈGLES ESSENTIELLES</div><h3>${D.rules.deckSize} cartes • ${D.rules.startingLife} PV • ${D.rules.lanes} voies</h3><div class="quick-list"><div class="quick-row"><div class="quick-icon">1</div><div><b>Début</b><span>5 cartes en main; l’énergie maximale augmente de 1 par tour.</span></div></div><div class="quick-row"><div class="quick-icon">2</div><div><b>Unités</b><span>Une unité par voie; combat simultané lorsque deux unités s’affrontent.</span></div></div><div class="quick-row"><div class="quick-icon">3</div><div><b>Cartes de soutien</b><span>Tactiques instantanées, Équipements attachés et un Lieu par joueur.</span></div></div><div class="quick-row"><div class="quick-icon">4</div><div><b>Victoire</b><span>Attaque directe dans une voie libre et réduisez les PV adverses à zéro.</span></div></div></div></section><section class="panel source-card span-6"><div class="eyebrow">RARETÉS DE COLLECTION</div><table class="rarity-table"><thead><tr><th>Rareté</th><th>Code</th><th>Valeur</th><th>Booster</th></tr></thead><tbody>${Object.entries(D.rarities).map(([id,r])=>`<tr><td><i class="rarity-dot" style="--rc:${RARITY_COLORS[id]}"></i>${r.name}</td><td>${id}</td><td>${r.dust} poussières</td><td>${r.odds}</td></tr>`).join('')}</tbody></table></section>
    <section class="panel source-card span-12"><div class="eyebrow">MOTS-CLÉS</div><div class="glossary" style="margin-top:14px">${Object.entries(D.keywords).map(([k,v])=>`<div class="glossary-row"><b>${k}</b><span>${esc(v)}</span></div>`).join('')}</div></section><section class="panel source-card span-12"><div class="eyebrow">EXTENSIONS</div><div class="pack-grid" style="margin-top:14px">${Object.entries(D.sets).map(([id,s])=>`<div class="panel pad" style="border-color:color-mix(in srgb,${s.accent} 24%,transparent)"><b style="color:${s.accent}">${id} — ${esc(s.name)}</b><p>${esc(s.description)}</p><span class="subtle" style="font-size:10px">${D.cards.filter(c=>c.set===id).length} cartes</span></div>`).join('')}</div></section></div>`,true);}

  function unitFlags(battle,u){const out=[];if(u.cloaked)out.push(['◌','Camouflage']);if(u.stunned>0)out.push(['⌁','Étourdi']);if(battle.has(u,'ARMOR')&&!u.armorUsed)out.push(['⬡','Armure']);if(u.equipment.length)out.push([`⚙${u.equipment.length}`,'Équipement']);return out.map(([x,t])=>`<span class="unit-flag" title="${t}">${x}</span>`).join('');}
  function battleUnitHTML(battle,sideIndex,lane,u,pending){
    if(!u)return '<span class="slot-empty">Voie libre</span>';const c=CARD.get(u.cardId),max=battle.unitMaxHealth(sideIndex,u),atk=battle.unitAttack(sideIndex,u);const canAttack=sideIndex===0&&battle.legalAttacks(0,lane).length>0&&!state.battleContext?.aiBusy;
    return `<div class="battle-unit" data-unit-side="${sideIndex}" data-unit-lane="${lane}">${cardHTML({...c,attack:atk,health:max},{mini:true,foil:RANK[c.rarity]>=4})}<span class="unit-health">${U.format(u.currentHealth)}/${U.format(max)}</span><div class="unit-flags">${unitFlags(battle,u)}</div>${canAttack?`<button class="attack-btn" data-action="battle-attack" data-lane="${lane}">⚔ ATTAQUER</button>`:''}</div>`;
  }
  function renderBattle(){
    const ctx=state.battleContext;if(!ctx)return renderHome();const b=ctx.battle,s=b.state,me=s.sides[0],ai=s.sides[1],pending=state.ui.pending;
    const targetHas=(kind,lane=null)=>pending?.targets?.some(t=>t.kind===kind&&(lane===null||(t.lane??-1)===lane));
    const commander=(side,idx,enemy=false)=>`<div class="commander ${enemy?'enemy':''} ${enemy&&targetHas('HERO')?'valid':''}" ${enemy&&targetHas('HERO')?'data-action="battle-target-hero"':''}><div class="avatar">${enemy?'☣':'✦'}</div><div class="commander-name"><b>${esc(side.name)}</b><span>${enemy?'IA tactique':esc(Store.data.profile.name)} • Tour ${s.round}</span></div><div class="life-wrap"><div class="life-label"><span>INTÉGRITÉ</span><b>${U.format(side.life)} / ${U.format(side.maxLife)}</b></div><div class="life-bar"><i style="width:${Math.max(0,side.life/side.maxLife*100)}%"></i></div></div><div class="energy-orbs" title="${side.energy}/${side.maxEnergy} énergie">${Array.from({length:10},(_,i)=>`<i class="orb ${i<side.energy?'full':''}"></i>`).join('')}</div></div>`;
    const lanes=[0,1,2].map(lane=>{const enemyValid=targetHas('ENEMY_UNIT',lane)||targetHas('UNIT',lane),friendValid=targetHas('FRIENDLY_UNIT',lane)||targetHas('FRIENDLY_LANE',lane);return `<div class="lane"><div class="unit-slot enemy ${enemyValid?'valid':''}" ${enemyValid?`data-action="battle-target" data-kind="${targetHas('UNIT',lane)?'UNIT':'ENEMY_UNIT'}" data-lane="${lane}"`:''}>${battleUnitHTML(b,1,lane,ai.board[lane],pending)}</div><div class="lane-center">VOIE 0${lane+1}</div><div class="unit-slot ${friendValid?'valid':''}" ${friendValid?`data-action="battle-target" data-kind="${targetHas('FRIENDLY_LANE',lane)?'FRIENDLY_LANE':'FRIENDLY_UNIT'}" data-lane="${lane}"`:''}>${battleUnitHTML(b,0,lane,me.board[lane],pending)}</div></div>`}).join('');
    const hand=me.hand.map((id,i)=>{const c=CARD.get(id),check=b.canPlay(0,i),selected=pending?.mode==='play'&&pending.handIndex===i;return `<div class="hand-card ${check.ok?'':'unplayable'} ${selected?'selected':''}" data-action="battle-hand" data-index="${i}" title="${check.ok?'Jouer la carte':esc(check.reason)}">${cardHTML(c,{mini:true,foil:RANK[c.rarity]>=4})}</div>`}).join('');
    const pendingText=pending?(pending.mode==='play'?`Choisissez une cible pour ${CARD.get(pending.cardId).name}.`:'Choisissez la cible de l’attaque.'):(ctx.aiBusy?'Directive adverse en cours…':s.active===0?'Jouez une carte ou attaquez, puis terminez le tour.':'Tour adverse.');
    return shell(`<div class="battle-shell"><section class="battle-main">${commander(ai,1,true)}<div class="enemy-hand">${ai.hand.map(()=>'<i class="hand-back"></i>').join('')}</div><div class="location-strip"><span class="location-chip">Lieu adverse : <b>${ai.location?esc(CARD.get(ai.location.cardId).name):'Aucun'}</b></span></div><div class="battle-board">${lanes}</div><div class="location-strip"><span class="location-chip">Votre lieu : <b>${me.location?esc(CARD.get(me.location.cardId).name):'Aucun'}</b></span></div>${commander(me,0,false)}<div class="battle-controls"><span class="pending-text">${esc(pendingText)}</span>${pending?'<button class="btn small" data-action="battle-cancel">Annuler</button>':''}<button class="btn danger small" data-action="battle-surrender">Abandonner</button><button class="btn primary" data-action="battle-end" ${s.active===0&&!ctx.aiBusy&&s.winner===null?'':'disabled'}>Terminer le tour</button></div><div class="player-hand">${hand||'<span class="subtle">Main vide</span>'}</div></section><aside class="battle-side"><div class="panel battle-info"><h3>ÉTAT DU DUEL</h3><div class="battle-stats"><div class="battle-stat"><b>${me.energy}/${me.maxEnergy}</b><span>ÉNERGIE</span></div><div class="battle-stat"><b>${me.trophies}</b><span>TROPHÉES</span></div><div class="battle-stat"><b>${me.deck.length}</b><span>DECK</span></div><div class="battle-stat"><b>${me.discard.length}</b><span>DÉFAUSSE</span></div></div></div><div class="panel battle-info"><h3>JOURNAL TACTIQUE</h3><div class="battle-log">${s.log.map(l=>`<div class="log-row ${l.tone}">${esc(l.text)}</div>`).join('')}</div></div><div class="panel battle-info"><h3>RAPPEL</h3><p class="subtle" style="font-size:10px;line-height:1.5">Cliquez une carte de votre main, puis une voie surlignée. Pour attaquer, cliquez « Attaquer » sous une unité prête puis choisissez la cible.</p></div></aside></div>`,true).replace('<main class="screen wide">','<main class="screen wide battle-screen">');
  }

  function render(){
    const map={home:renderHome,play:renderPlay,collection:renderCollection,boosters:renderBoosters,decks:renderDecks,campaign:renderCampaign,archive:renderArchive,battle:renderBattle};root.innerHTML=(map[state.screen]||renderHome)();document.title=`${state.screen==='home'?'AVP: HUNT // HIVE TCG':state.screen.toUpperCase()+' — AVP TCG'}`;
    const count=root.querySelector('[data-filter-count]');if(count&&state.screen==='collection')count.textContent=`${filteredCards().length} / ${D.cards.length} cartes`;
  }

  function modal(title,body,opts={}){modalRoot.innerHTML=`<div class="modal-layer" data-action="modal-backdrop"><section class="modal ${opts.small?'small':''} ${opts.className||''}" role="dialog" aria-modal="true"><header class="modal-head"><h2>${title}</h2>${opts.locked?'':'<button class="close-btn" data-action="close-modal" aria-label="Fermer">×</button>'}</header><div class="modal-body">${body}</div></section></div>`;}
  function closeModal(){modalRoot.innerHTML='';state.ui.opening=null;}
  function toast(text,tone=''){let stack=document.querySelector('.toast-stack');if(!stack){stack=document.createElement('div');stack.className='toast-stack';document.body.appendChild(stack);}const el=document.createElement('div');el.className=`toast ${tone}`;el.textContent=text;stack.appendChild(el);setTimeout(()=>el.remove(),3300);}

  function showOnboarding(){
    const highlights={XENO:['Couvée et invocation','Sang acide à la destruction','Reine comme finisher'],YAUTJA:['Camouflage et ciblage','Équipements modulaires','Trophées et pioche'],HUMAN:['Escouades équilibrées','Contrôle des voies','Arsenal colonial']};
    modal('Choisissez votre premier deck',`<div style="text-align:center;margin-bottom:20px"><div class="eyebrow">DIRECTIVE DE DÉMARRAGE</div><h2 style="font-size:30px;margin:8px">Quelle faction dirigerez-vous ?</h2><p class="subtle">Vous recevez le deck complet de 30 cartes, une sélection de Communes et 6 500 crédits de boosters.</p></div><div class="starter-grid">${['XENO','YAUTJA','HUMAN'].map(id=>{const d=D.starterDecks[id],f=faction(id);return `<article class="panel starter" style="--sc:${f.accent}" data-action="choose-starter" data-id="${id}"><div class="starter-symbol">${f.symbol}</div><div class="eyebrow" style="color:${f.accent}">${f.name}</div><h3>${esc(d.name)}</h3><p>${esc(d.description)}</p><ul>${highlights[id].map(x=>`<li>✓ ${x}</li>`).join('')}</ul><button class="btn primary block">Choisir ce deck</button></article>`}).join('')}</div>`,{locked:true,className:'onboarding'});
  }
  function chooseStarter(id){const template=D.starterDecks[id];if(!template)return;for(const c of D.cards.filter(c=>c.rarity==='C'))Store.add(c.id,1);for(const [cardId,count] of Object.entries(template.cards))Store.data.collection[cardId]=Math.max(Store.owned(cardId),count);const deck={id:U.uid('deck'),name:template.name,faction:id,cards:U.clone(template.cards),createdAt:new Date().toISOString()};Store.data.decks=[deck];Store.data.activeDeckId=deck.id;state.selectedDeckId=deck.id;Store.data.starterChosen=true;Store.save();closeModal();AudioSys.cue('rare');toast(`${template.name} ajouté à votre collection.`, 'good');render();}

  function showCardDetail(id){const c=CARD.get(id);if(!c)return;const f=faction(c.faction),r=rarity(c.rarity),owned=Store.owned(id),reserved=cardReserved(id),craft=r.dust*2;modal(`${f.symbol} ${esc(c.name)}`,`<div class="card-detail"><div class="card-wrap">${cardHTML(c,{foil:RANK[c.rarity]>=3})}</div><div class="detail-copy"><div class="eyebrow" style="color:${f.accent}">${c.collectorNo} • ${r.name}</div><h2>${esc(c.name)}</h2><p>${esc(c.text)}</p>${c.keywords.length?`<div class="card-keywords">${c.keywords.map(k=>`<span class="kw" title="${esc(D.keywords[k]||'')}">${k}</span>`).join('')}</div>`:''}<p class="lore">${esc(c.flavor||'Aucune note de terrain.')}</p><div class="detail-stats"><div class="detail-stat"><b>${c.cost}</b><span>Énergie</span></div><div class="detail-stat"><b>${owned}</b><span>Possédées</span></div><div class="detail-stat"><b>${TYPE_NAMES[c.type]}</b><span>Type</span></div></div><div class="source-note"><b>Traçabilité :</b> ${esc(c.source.workbook)} → ${esc(c.source.sheet)} → « ${esc(c.source.entry)} »${c.source.prototype?'<br><b>Statut :</b> contenu coupé / prototype séparé du canon principal.':''}</div><div class="detail-actions"><button class="btn secondary" data-action="craft-card" data-card-id="${c.id}" ${Store.data.profile.dust<craft?'disabled':''}>Fabriquer • ${craft} ✧</button><button class="btn ghost" data-action="dust-card" data-card-id="${c.id}" ${owned<=reserved?'disabled':''}>Désassembler • +${r.dust} ✧</button></div><p class="subtle" style="font-size:10px">${reserved?`${reserved} exemplaire(s) réservé(s) par un deck.`:'Aucun exemplaire réservé.'}</p></div></div>`);}
  function craftCard(id){const c=CARD.get(id),cost=rarity(c.rarity).dust*2;if(Store.data.profile.dust<cost)return;Store.data.profile.dust-=cost;Store.add(id,1);Store.save();AudioSys.cue('card');showCardDetail(id);render();toast(`${c.name} fabriquée.`, 'good');}
  function dustCard(id){const c=CARD.get(id),owned=Store.owned(id);if(owned<=cardReserved(id))return;Store.data.collection[id]=owned-1;Store.data.profile.dust+=rarity(c.rarity).dust;Store.save();showCardDetail(id);render();toast(`${c.name} désassemblée.`);}

  function awardAchievement(id){if(Store.data.achievements[id])return;const a=D.achievements.find(x=>x.id===id);if(!a)return;Store.data.achievements[id]=new Date().toISOString();Store.data.profile.credits+=a.reward;toast(`Succès : ${a.name} (+${a.reward} crédits)`, 'good');}
  function checkAchievements(extra={}){const p=Store.data.profile;if(p.packsOpened>=1)awardAchievement('first_pack');if(p.wins>=1)awardAchievement('first_win');if(ownedUnique()>=50)awardAchievement('collector_50');if(p.totalTrophies>=10)awardAchievement('trophy_10');if(p.completedMissions>=8)awardAchievement('campaign_clear');if(extra.secret)awardAchievement('secret_pull');Store.save();}

  function buyPack(id){const pack=D.boosters.find(p=>p.id===id),p=Store.data.profile;if(!pack||p.completedMissions<(pack.unlocksAt||0)||p.credits<pack.price)return;p.credits-=pack.price;const result=E.openBooster(id,{pity:p.pity,seed:Date.now()^p.packsOpened});p.packsOpened++;const had={};for(const pull of result.pulls){had[pull.cardId]=Store.owned(pull.cardId);Store.add(pull.cardId,1);Store.data.seenCards[pull.cardId]=true;}if(result.bestRank>=4)p.pity=0;else p.pity++;state.ui.opening={result,revealed:new Set(),had};Store.save();checkAchievements({secret:result.bestRank>=5});AudioSys.cue('pack');renderOpening();}
  function renderOpening(){const o=state.ui.opening;if(!o)return;const pulls=o.result.pulls;const all=o.revealed.size===pulls.length;modalRoot.innerHTML=`<div class="modal-layer"><section class="modal booster-open"><div class="opening-stage"><div class="opening-title"><div class="eyebrow">${o.result.pack.set} // OUVERTURE</div><h2>${esc(o.result.pack.name)}</h2><p class="subtle">Cliquez les cartes pour les révéler.</p></div><div class="pull-grid">${pulls.map((p,i)=>{const c=CARD.get(p.cardId),revealed=o.revealed.has(i),isBest=RANK[c.rarity]===o.result.bestRank;return `<div class="pull-card ${revealed?'revealed':''} ${isBest?'best':''}" data-action="reveal-pull" data-index="${i}"><div class="pull-inner"><div class="pull-face back">${cardHTML(c,{back:true,mini:true})}</div><div class="pull-face front">${cardHTML(c,{mini:true,foil:p.foil})}${revealed&&o.had[c.id]===0?'<span class="owned-badge">NEW</span>':''}</div></div></div>`}).join('')}</div><div class="opening-actions"><button class="btn ghost" data-action="reveal-all">Tout révéler</button>${all?`<button class="btn secondary" data-action="open-another" data-id="${o.result.pack.id}" ${Store.data.profile.credits<o.result.pack.price?'disabled':''}>Ouvrir encore</button><button class="btn primary" data-action="finish-opening">Continuer</button>`:''}</div><p class="opening-hint">Meilleure rareté : ${rarity(pulls.reduce((best,p)=>RANK[CARD.get(p.cardId).rarity]>RANK[CARD.get(best.cardId).rarity]?p:best,pulls[0]).cardId?CARD.get(pulls.reduce((best,p)=>RANK[CARD.get(p.cardId).rarity]>RANK[CARD.get(best.cardId).rarity]?p:best,pulls[0]).cardId).rarity:'C').name}</p></div></section></div>`;}
  function revealPull(i){const o=state.ui.opening;if(!o||o.revealed.has(i))return;o.revealed.add(i);const c=CARD.get(o.result.pulls[i].cardId);AudioSys.cue(RANK[c.rarity]>=3?'rare':'card');renderOpening();}

  function addDeckCard(id){const d=activeDeck();if(!d)return;const owned=Store.owned(id),current=d.cards[id]||0;if(deckTotal(d)>=30){toast('Le deck contient déjà 30 cartes.','bad');return;}if(current>=3||current>=owned){toast('Aucun exemplaire supplémentaire disponible.','bad');return;}d.cards[id]=current+1;Store.save();AudioSys.cue('click');render();}
  function removeDeckCard(id){const d=activeDeck();if(!d||!d.cards[id])return;d.cards[id]--;if(d.cards[id]<=0)delete d.cards[id];Store.save();render();}
  function newDeck(){if(Store.data.decks.length>=8){toast('Limite de huit decks atteinte.','bad');return;}const d={id:U.uid('deck'),name:`Nouveau deck ${Store.data.decks.length+1}`,faction:'MIXED',cards:{},createdAt:new Date().toISOString()};Store.data.decks.push(d);state.selectedDeckId=d.id;Store.save();render();}
  function autoFillDeck(){const d=activeDeck();if(!d)return;const preferred=d.faction&&D.factions[d.faction]?d.faction:null;const candidates=D.cards.filter(c=>Store.owned(c.id)>0&&(preferred?c.faction===preferred||c.faction==='NEUTRAL':true)).sort((a,b)=>{const ta={UNIT:0,TACTIC:1,EQUIPMENT:2,LOCATION:3};return ta[a.type]-ta[b.type]||a.cost-b.cost||RANK[b.rarity]-RANK[a.rarity]});const map={};let total=0;for(const c of candidates){let target=c.type==='UNIT'?2:1;target=Math.min(target,Store.owned(c.id),3);while(target>0&&total<30){map[c.id]=(map[c.id]||0)+1;target--;total++;}}if(total<30){for(const c of D.cards.filter(c=>Store.owned(c.id)>0)){while((map[c.id]||0)<Math.min(3,Store.owned(c.id))&&total<30){map[c.id]=(map[c.id]||0)+1;total++;}}}d.cards=map;Store.save();render();toast(`${total}/30 cartes ajoutées.`,total===30?'good':'bad');}

  function startBattle(mode,mission=null){const deck=Store.deck();if(!deck)return;const valid=E.validateDeck(deck.cards,Store.data.collection);if(!valid.valid){toast(valid.errors[0],'bad');return;}const diff=mission?mission.difficulty:(DIFFICULTIES.find(d=>d.id===state.ui.difficulty)?.value||1);const factions=mission?mission.factions:[state.ui.enemyFaction];const aiDeck=E.buildAiDeck(factions,diff,Date.now()^U.hash(mode+(mission?.id||0)));const ctx={mode,mission,difficulty:diff,aiBusy:false,rewarded:false,battle:null};const battle=new E.Battle({playerName:Store.data.profile.name,playerDeck:deck.cards,aiDeck,difficulty:diff,modifiers:mission?.modifiers||[],aiName:mission?mission.name:`IA ${faction(factions[0]).name}`,seed:Date.now(),onChange:()=>{if(state.battleContext===ctx&&state.screen==='battle')render();},onGameOver:r=>onBattleOver(ctx,r)});ctx.battle=battle;state.battleContext=ctx;state.ui.pending=null;state.screen='battle';state.lastQuickConfig={mode,missionId:mission?.id||null};closeModal();window.scrollTo({top:0,behavior:'auto'});AudioSys.cue('card');render();window.scrollTo({top:0,behavior:'auto'});}
  function onBattleOver(ctx,result){if(ctx.rewarded)return;ctx.rewarded=true;const p=Store.data.profile,me=result.state.sides[0];p.totalTrophies+=me.totalTrophies;let reward=0,xp=0,title='Duel terminé';if(result.winner===0){p.wins++;reward=ctx.mode==='campaign'?ctx.mission.reward:Math.round(450*ctx.difficulty);xp=ctx.mode==='campaign'?500:260;title='Victoire';if(ctx.mode==='campaign'){const first=ctx.mission.id>p.completedMissions;if(first)p.completedMissions=Math.max(p.completedMissions,ctx.mission.id);else reward=Math.round(reward*.35);}}else if(result.winner===1){p.losses++;reward=120;xp=90;title='Défaite';}else{p.draws++;reward=180;xp=120;title='Destruction mutuelle';}p.credits+=reward;addXP(xp);Store.data.history.unshift({date:new Date().toISOString(),mode:ctx.mode,mission:ctx.mission?.id||null,winner:result.winner,reward,round:result.state.round});Store.data.history=Store.data.history.slice(0,25);checkAchievements();Store.save();AudioSys.cue(result.winner===0?'win':'lose');setTimeout(()=>showResultModal(ctx,result,title,reward,xp),Store.data.settings.motion?350:0);}
  function showResultModal(ctx,result,title,reward,xp){const won=result.winner===0;modal(title,`<div style="text-align:center;padding:10px"><div style="font-size:76px;color:${won?'var(--good)':'var(--danger)'}">${won?'✦':'☣'}</div><h2 style="font-size:34px;margin:5px">${esc(title)}</h2><p class="subtle">${esc(result.reason)} • ${result.state.round} tours</p><div class="detail-stats" style="max-width:520px;margin:22px auto"><div class="detail-stat"><b>+${U.format(reward)}</b><span>Crédits</span></div><div class="detail-stat"><b>+${U.format(xp)}</b><span>XP</span></div><div class="detail-stat"><b>${result.state.sides[0].totalTrophies}</b><span>Trophées</span></div></div><div class="detail-actions" style="justify-content:center"><button class="btn ghost" data-action="result-home">Accueil</button>${ctx.mode==='quick'?'<button class="btn secondary" data-action="result-rematch">Revanche</button>':''}<button class="btn primary" data-action="result-continue">${ctx.mode==='campaign'?'Campagne':'Jouer'}</button></div></div>`,{locked:true,small:true});}
  async function endPlayerTurn(){const ctx=state.battleContext;if(!ctx||ctx.aiBusy||ctx.battle.state.active!==0)return;state.ui.pending=null;ctx.battle.endTurn(0);ctx.aiBusy=true;render();const delay=()=>new Promise(r=>setTimeout(r,Store.data.settings.motion?280:25));await ctx.battle.takeAITurn(async()=>{render();await delay();});ctx.aiBusy=false;render();}

  function showSettings(){modal('Paramètres & sauvegarde',`<div class="settings-grid"><div class="setting-row"><div><b>Effets sonores</b><span>Synthèse audio locale, sans fichier externe.</span></div><button class="switch ${Store.data.settings.sound?'on':''}" data-action="toggle-setting" data-key="sound"></button></div><div class="setting-row"><div><b>Animations</b><span>Foils, transitions et délai de l’IA.</span></div><button class="switch ${Store.data.settings.motion?'on':''}" data-action="toggle-setting" data-key="motion"></button></div><div class="setting-row"><div><b>Exporter la sauvegarde</b><span>Collection, decks et progression au format JSON.</span></div><button class="btn small" data-action="export-save">Exporter</button></div><div class="setting-row"><div><b>Importer une sauvegarde</b><span>Remplace les données locales après validation.</span></div><label class="btn small">Importer<input class="sr-only" type="file" accept="application/json" data-action="import-save"></label></div><div class="setting-row"><div><b>Réinitialiser le profil</b><span>Supprime la progression locale et relance le choix de faction.</span></div><button class="btn danger small" data-action="reset-save">Réinitialiser</button></div></div><div class="source-note">Sauvegarde locale : <span class="mono">${STORAGE_KEY}</span><br>Aucun compte, serveur ou achat réel n’est utilisé.</div>`,{small:true});}
  function downloadJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

  function navigate(screen){if(state.screen==='battle'&&state.battleContext?.battle.state.winner===null&&screen!=='battle'){if(!confirm('Quitter le duel en cours ?'))return;}state.screen=screen;state.ui.pending=null;if(screen==='decks'&&!state.selectedDeckId)state.selectedDeckId=Store.data.activeDeckId;window.scrollTo({top:0,behavior:Store.data.settings.motion?'smooth':'auto'});render();}
  function quickLaunch(){const deck=Store.deck();if(deck&&E.validateDeck(deck.cards,Store.data.collection).valid)startBattle('quick');else navigate('decks');}

  async function handleClick(ev){const el=ev.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;AudioSys.cue('click');
    if(action==='nav')navigate(el.dataset.screen);
    else if(action==='settings')showSettings();else if(action==='close-modal')closeModal();else if(action==='modal-backdrop'&&ev.target===el)closeModal();
    else if(action==='choose-starter')chooseStarter(el.dataset.id);else if(action==='view-card')showCardDetail(el.dataset.cardId);else if(action==='craft-card')craftCard(el.dataset.cardId);else if(action==='dust-card')dustCard(el.dataset.cardId);
    else if(action==='quick-launch')quickLaunch();else if(action==='difficulty'){state.ui.difficulty=el.dataset.id;render();}else if(action==='enemy-faction'){state.ui.enemyFaction=el.dataset.id;render();}else if(action==='start-quick')startBattle('quick');
    else if(action==='buy-pack')buyPack(el.dataset.id);else if(action==='reveal-pull')revealPull(Number(el.dataset.index));else if(action==='reveal-all'){for(let i=0;i<state.ui.opening.result.pulls.length;i++)state.ui.opening.revealed.add(i);AudioSys.cue('rare');renderOpening();}else if(action==='open-another'){const id=el.dataset.id;closeModal();buyPack(id);}else if(action==='finish-opening'){closeModal();render();}
    else if(action==='select-deck'){state.selectedDeckId=el.dataset.id;render();}else if(action==='deck-add')addDeckCard(el.dataset.cardId);else if(action==='deck-remove')removeDeckCard(el.dataset.cardId);else if(action==='new-deck')newDeck();else if(action==='auto-fill-deck')autoFillDeck();else if(action==='set-active-deck'){const d=activeDeck();if(d){Store.data.activeDeckId=d.id;Store.save();toast(`${d.name} est désormais actif.`,'good');render();}}else if(action==='rename-deck'){const d=activeDeck(),name=prompt('Nom du deck',d?.name||'');if(d&&name?.trim()){d.name=name.trim().slice(0,40);Store.save();render();}}
    else if(action==='start-mission'){const m=D.campaign.find(x=>x.id===Number(el.dataset.id));if(m)startBattle('campaign',m);}
    else if(action==='battle-hand'){const ctx=state.battleContext,b=ctx?.battle,index=Number(el.dataset.index);if(!b||ctx.aiBusy)return;const check=b.canPlay(0,index);if(!check.ok){toast(check.reason,'bad');return;}if(check.targets.length===1&&check.targets[0].kind==='NONE'){b.playCard(0,index,check.targets[0]);state.ui.pending=null;}else state.ui.pending={mode:'play',handIndex:index,cardId:b.side(0).hand[index],targets:check.targets};render();}
    else if(action==='battle-target'){const p=state.ui.pending;if(!p)return;const target={kind:el.dataset.kind,lane:Number(el.dataset.lane)};if(p.mode==='play')state.battleContext.battle.playCard(0,p.handIndex,target);else state.battleContext.battle.attack(0,p.lane,{kind:'UNIT',lane:target.lane});state.ui.pending=null;render();}
    else if(action==='battle-target-hero'){const p=state.ui.pending;if(p?.mode==='attack')state.battleContext.battle.attack(0,p.lane,{kind:'HERO'});state.ui.pending=null;render();}
    else if(action==='battle-attack'){const lane=Number(el.dataset.lane),targets=state.battleContext.battle.legalAttacks(0,lane);state.ui.pending={mode:'attack',lane,targets};render();}
    else if(action==='battle-cancel'){state.ui.pending=null;render();}else if(action==='battle-end')await endPlayerTurn();else if(action==='battle-surrender'){if(confirm('Abandonner ce duel ?')){state.battleContext.battle.damageHero(0,99999,{kind:'SURRENDER'});render();}}
    else if(action==='result-home'){closeModal();state.battleContext=null;navigate('home');}else if(action==='result-continue'){closeModal();state.battleContext=null;navigate(state.lastQuickConfig?.mode==='campaign'?'campaign':'play');}else if(action==='result-rematch'){closeModal();state.battleContext=null;startBattle('quick');}
    else if(action==='toggle-setting'){const k=el.dataset.key;Store.data.settings[k]=!Store.data.settings[k];Store.save();showSettings();render();}else if(action==='export-save')downloadJSON('AVP_HUNT_HIVE_SAVE.json',Store.data);else if(action==='reset-save'){if(confirm('Supprimer définitivement la sauvegarde locale ?')){Store.reset();state.screen='home';state.selectedDeckId=null;closeModal();render();setTimeout(showOnboarding,50);}}
    else if(action==='export-catalog')downloadJSON('AVP_HUNT_HIVE_CARD_CATALOG.json',D);
  }

  root.addEventListener('click',handleClick);modalRoot.addEventListener('click',handleClick);
  const filterInput=debounce((prefix,key,value)=>{const target=prefix==='deck'?state.deckFilters:state.filters;target[key]=value;render();},100);
  root.addEventListener('input',ev=>{const el=ev.target.closest('[data-filter]');if(el)filterInput(el.dataset.filterPrefix,el.dataset.filter,el.value);});
  root.addEventListener('change',ev=>{const el=ev.target.closest('[data-filter]');if(el){const target=el.dataset.filterPrefix==='deck'?state.deckFilters:state.filters;target[el.dataset.filter]=el.value;render();}});
  modalRoot.addEventListener('change',ev=>{if(ev.target.matches('input[type=file][data-action="import-save"]')){const file=ev.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);Store.data=mergeSave(freshSave(),raw);Store.save();closeModal();render();toast('Sauvegarde importée.','good');}catch(e){toast('Fichier de sauvegarde invalide.','bad');}};r.readAsText(file);}});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(state.ui.pending){state.ui.pending=null;render();}else if(modalRoot.innerHTML)closeModal();}if(state.screen==='battle'&&ev.key==='Enter'&&!state.battleContext?.aiBusy)endPlayerTurn();});

  window.AVP_APP={Store,state,render,startBattle,buyPack,showCardDetail,reset:()=>{Store.reset();location.reload();}};
  render();if(!Store.data.starterChosen)setTimeout(showOnboarding,80);
})();
</script></body></html>
